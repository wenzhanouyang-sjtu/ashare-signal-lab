# ============================================================================
# 全部研究参数集中于此。
#
# 设计原则：代码中不得出现硬编码的参数。所有会影响结果的数值都声明在这里，
# 这样"我们究竟试了多少组参数"是可核查的 —— 这是多重检验校正 (FDR / DSR)
# 的输入，也是审阅者判断结果是否可信的前提。
# ============================================================================

project:
  name: ashare-signal-lab
  # 保留位：研究流程本身**不含任何随机数** —— 置换检验已改为穷举全部
  # 不重复位移，抽样环节随之消失。删掉这个键、重跑全流程，结果逐位不变。
  # （tests/ 里的合成数据用各自独立的 rng，不读这里。）
  seed: 20240914

data:
  # 数据源优先级：主源失败自动降级到备源。
  # 注：东方财富接口 (stock_zh_a_hist) 在本机网络下不可用，故不列入。
  sources: [sina, tencent]

  start_date: "20150101"
  end_date: "20241231"

  universe:
    index_code: "000300"    # 沪深300；备选 000905 (中证500)
    index_name: "沪深300"
    max_stocks: null        # null = 全部成分股；调试时设为 10 做端到端冒烟测试

  fetch:
    sleep_between: 0.4      # 请求间隔（秒）。侦查发现新浪接口会限流，不可去掉
    max_retries: 3
    backoff_base: 2.0       # 指数退避基数：0.4s -> 0.8s -> 1.6s
    timeout: 30

  cache_dir: "data_cache"

# ---------------------------------------------------------------------------
# A股真实交易摩擦。这是本项目与"假装零成本"的回测的分水岭。
# ---------------------------------------------------------------------------
backtest:
  costs:
    commission: 0.00025     # 佣金：双边，万 2.5
    stamp_tax: 0.0005       # 印花税：仅卖出单边（2023-08-28 起由 0.1% 降至 0.05%）
    transfer_fee: 0.00001   # 过户费：双边，十万分之一
    impact_coef: 0.10       # 冲击成本系数：成交额占比 × 该系数
    impact_model: "sqrt"    # 冲击成本随参与率非线性增长：sqrt(participation)

  execution:
    t_plus_1: true          # T+1：当日买入的股票当日不可卖出
    limit_updown: true      # 涨跌停板：封板不可成交
    suspension: true        # 停牌：不可交易
    signal_lag: 1           # 信号 t 日收盘生成，t+1 开盘执行。
    # 无交易带：目标权重偏离小于此阈值时不交易。
    # 没有它，引擎会为了精确维持目标仓位而每天做微小交易，
    # 白白推高换手率。真实组合管理普遍使用 no-trade band。
    min_trade_weight: 0.001

  # 涨跌停幅度（按板块）
  #
  # ⚠ 这里**不能**再写 ST: 0.05。board_of() 只按代码前缀返回
  #   STAR / ChiNext / BSE / default，永远返回不了 "ST"，
  #   所以任何 ST 条目都是死配置 —— 看起来实现了，实际从未被读到。
  #   数据源也不含股票名称历史，无法补出 ST 状态（详见 README 已知局限 11）。
  #   后果有方向：ST 股票的封板被少判 → 回测偏乐观。
  #   tests/test_config.py::test_no_dead_price_limit_keys 盯着这件事。
  price_limits:
    default: 0.10           # 主板 ±10%
    STAR: 0.20              # 科创板 (688xxx) ±20%
    ChiNext: 0.20           # 创业板 (300xxx) ±20%
    BSE: 0.30               # 北交所 ±30%（board_of 会返回 BSE，此前未列，已补）

  rebalance: "W"            # 调仓频率：W=周频 / D=日频 / M=月频
                            # 侦查结论：日频调仓 + 15bp 单边成本 ≈ 年化 75% 成本，
                            # 会吃掉任何日频信号。故默认周频。

  # 换手率控制：进入与退出阈值分离，避免临界点反复触发
  buffer:
    entry_z: 2.0            # 开仓阈值
    exit_z: 0.5             # 平仓阈值（留出缓冲带）

  gross_exposure: 1.0       # 总仓位（1.0 = 满仓多空各半）
  quantile: 0.2             # 截面信号每侧选取比例（0.2 = 各取前 20%）
  min_names: 20             # 当日有效股票数少于此值则清仓

# ---------------------------------------------------------------------------
# 待检验的信号族。每个族内的参数网格会被完整枚举 ——
# 枚举出的组合数就是多重检验的试验次数。
# ---------------------------------------------------------------------------
signals:
  pairs:
    enabled: true
    beta_window: 60             # 滚动 beta 估计窗口
    zscore_window: 60           # 价差 z 分数的归一化窗口
    exit_z: 0.5                 # 平仓阈值（|z| 回落到此值即平仓）
                                # 与 entry_z 构成缓冲带，避免临界点反复开关
    entry_z: 2.0                # 开仓阈值。**故意不放进网格**：
                                # 候选池约 2500 对时，每周 |z|>2.5 的配对
                                # 有 60~190 个，第 20 大的 |z| 从未低于 2.87，
                                # 因此该阈值在 top_k 约束下不 binding —— 是退化参数。
                                # 详见 README「一个退化参数」一节。
    # 参数网格 —— 每一组都会被完整回测，组合数计入多重检验的试验次数
    min_corr_grid: [0.6, 0.75]
    top_k_grid: [10, 20, 40]    # 持仓集中度：真正改变组合的维度

  reversal:
    enabled: true
    lookback_grid: [1, 5, 10, 20]   # 回看窗口（交易日）

  momentum:
    enabled: true
    lookback_grid: [20, 60, 120, 250]
    skip_grid: [0, 5]               # 跳过最近 N 日（规避短期反转污染）

  volatility:
    enabled: true
    lookback_grid: [20, 60]

# ---------------------------------------------------------------------------
# 验证层：这是本项目区别于"调参直到好看"的地方
# ---------------------------------------------------------------------------
validation:
  walkforward:
    n_splits: 5
    train_days: 750         # 约 3 年
    test_days: 250          # 约 1 年
    anchored: false         # false = 滚动窗口

  permutation:
    n_permutations: 1000    # 置换检验次数（打乱收益序列标签，构造零分布）
    method: "block"         # block = 分块置换，保留自相关结构
    block_size: 20

  multiple_testing:
    method: "fdr_bh"        # Benjamini-Hochberg FDR
    alpha: 0.05

  deflated_sharpe:
    enabled: true

report:
  figures_dir: "results/figures"
  results_dir: "results"
  dpi: 150
